<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e6"/>
      <stop offset="100%" stop-color="#f5e6cc"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc90e"/>
      <stop offset="100%" stop-color="#e3a73b"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#702217"/>
      <stop offset="100%" stop-color="#4a1410"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#591a11" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background decorative circular glow -->
  <circle cx="250" cy="160" r="140" fill="url(#g1)" opacity="0.8"/>
  <circle cx="250" cy="160" r="115" fill="#fff" opacity="0.6"/>

  <!-- Confetti / sprinkles -->
  <circle cx="120" cy="80" r="6" fill="#ffc90e"/>
  <circle cx="370" cy="75" r="7" fill="#c1592a"/>
  <circle cx="395" cy="135" r="5" fill="#3c5b43"/>
  <circle cx="105" cy="170" r="6" fill="#587a4a"/>
  <circle cx="140" cy="230" r="7" fill="#e3a73b"/>
  <circle cx="365" cy="225" r="5" fill="#ffc90e"/>
  
  <rect x="150" y="55" width="12" height="6" rx="3" fill="#c0522f" transform="rotate(25 150 55)"/>
  <rect x="330" y="60" width="14" height="6" rx="3" fill="#3c5b43" transform="rotate(-30 330 60)"/>
  <rect x="380" y="180" width="12" height="5" rx="2.5" fill="#e3a73b" transform="rotate(45 380 180)"/>
  <rect x="110" cy="120" width="12" height="5" rx="2.5" fill="#ffc90e" transform="rotate(-15 110 120)"/>

  <!-- Main Delivery Tiffin Box Illustration -->
  <g filter="url(#shadow)" transform="translate(170, 60)">
    <!-- Base Plate / Shadow -->
    <ellipse cx="80" cy="170" rx="75" ry="16" fill="#ded3c1" opacity="0.6"/>
    
    <!-- Tier 3 (Bottom Tiffin) -->
    <rect x="25" y="115" width="110" height="42" rx="14" fill="#faf6ee" stroke="#d5c8b2" stroke-width="2"/>
    <path d="M25 130 Q80 142 135 130" stroke="#d5c8b2" stroke-width="1.5" fill="none"/>
    <circle cx="80" cy="136" r="4" fill="#ffc90e"/>
    
    <!-- Tier 2 (Middle Tiffin) -->
    <rect x="30" y="75" width="100" height="42" rx="14" fill="#fff" stroke="#d5c8b2" stroke-width="2"/>
    <path d="M30 90 Q80 102 130 90" stroke="#d5c8b2" stroke-width="1.5" fill="none"/>
    <circle cx="80" cy="96" r="4" fill="#c1592a"/>
    
    <!-- Tier 1 (Top Tiffin) -->
    <rect x="35" y="38" width="90" height="40" rx="13" fill="url(#brandGrad)" stroke="#4a1410" stroke-width="1.5"/>
    <path d="M35 52 Q80 62 125 52" stroke="#ffc90e" stroke-width="2" fill="none"/>
    
    <!-- Handle Rack Carrier -->
    <path d="M20 135 L20 40 Q20 15 80 15 Q140 15 140 40 L140 135" fill="none" stroke="#e3a73b" stroke-width="6" stroke-linecap="round"/>
    <path d="M60 15 Q80 2 100 15" fill="none" stroke="#591a11" stroke-width="7" stroke-linecap="round"/>
    <circle cx="80" cy="12" r="5" fill="#ffc90e"/>

    <!-- Green check badge -->
    <g transform="translate(100, 100)">
      <circle cx="20" cy="20" r="22" fill="#3c5b43" stroke="#ffffff" stroke-width="3"/>
      <path d="M12 20 L17 25 L29 13" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
